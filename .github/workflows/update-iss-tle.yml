name: Update Spacecraft TLE Cache

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current ISS TLE
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE' \
            -o /tmp/iss.tle
          grep -q '^1 25544 ' /tmp/iss.tle
          grep -q '^2 25544 ' /tmp/iss.tle
          mkdir -p data
          cp /tmp/iss.tle data/iss.tle
      - name: Fetch current Earth-resource satellite TLEs
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://celestrak.org/NORAD/elements/gp.php?GROUP=resource&FORMAT=TLE' \
            -o /tmp/resource.tle
          python3 - <<'PY'
          from pathlib import Path
          wanted = {'TERRA', 'AQUA', 'LANDSAT 9', 'SENTINEL-1A'}
          lines = Path('/tmp/resource.tle').read_text().splitlines()
          out=[]
          for i, line in enumerate(lines):
              if line.strip() in wanted and i + 2 < len(lines) and lines[i+1].startswith('1 ') and lines[i+2].startswith('2 '):
                  out.extend([line.strip(), lines[i+1], lines[i+2]])
          if len(out) < 12:
              raise SystemExit('Expected Earth-resource TLEs were not found')
          Path('data/missions.tle').write_text('\n'.join(out) + '\n')
          PY
      - name: Commit updated orbital data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/iss.tle data/missions.tle
          git diff --cached --quiet && exit 0
          git commit -m 'Update spacecraft TLE cache'
          git push
