<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02060a">
  <title>Live Stream · Earth Observatory</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
  <style>
    :root{--white:#f4f8fb;--line:rgba(255,255,255,.11);--panel:rgba(3,9,15,.88);--cyan:#74edff;--green:#5ef0a6}
    html,body{height:100%;margin:0;background:#000;color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px}
    header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;color:var(--white);margin-bottom:18px}
    .brand{font-weight:900;font-size:22px;letter-spacing:-.03em}.sub{font-size:8px;letter-spacing:.15em;color:#9fb0bb}
    .card{background:linear-gradient(145deg,rgba(7,16,23,.92),rgba(1,6,11,.76));border:1px solid var(--line);border-radius:8px;padding:12px;width:100%;max-width:1100px;box-shadow:0 18px 55px rgba(0,0,0,.45)}
    .livestream-wrap{display:flex;flex-direction:column;gap:12px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:11px;letter-spacing:.08em}.state{color:var(--green);font-size:9px}
    .iframe-wrap{width:100%;display:block;position:relative;padding-top:56.25%;overflow:hidden;border-radius:6px;background:#02060a;box-shadow:0 0 0 1px rgba(116,237,255,.08) inset}
    .iframe-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.note{font-size:11px;color:#8fa0aa}.actions{display:flex;gap:7px}.actions a{display:inline-flex;align-items:center;justify-content:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;color:#c9d5db;text-decoration:none;font-size:9px;font-weight:800;letter-spacing:.06em;background:#ffffff04}.actions a:hover{color:var(--cyan);border-color:#74edff55}
    #musicBtn{position:fixed;right:16px;top:16px;z-index:80;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,0.02);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
    #musicBtn.on{background:linear-gradient(90deg,rgba(116,237,255,.12),rgba(94,240,166,.08));color:#dffcff}
    @media(max-width:640px){.container{padding:12px}.brand{font-size:16px}.sub{display:none}.card{padding:8px}.toolbar{align-items:flex-start}.note{font-size:10px}.actions a{padding:7px 8px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">EARTH OBSERVATORY</div>
      <div class="sub">LIVE · EARTH FROM SPACE</div>
    </header>

    <main class="card livestream">
      <div class="livestream-wrap">
        <div class="head"><span>LIVE STREAM</span><span class="state">● LIVE</span></div>
        <div class="iframe-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/awQzjn72bI0?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1"
            title="Earth Observatory live stream"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
        <div class="toolbar">
          <div class="note">Embedded using YouTube's privacy-enhanced no-cookie player. Playback starts muted to maximize compatibility.</div>
          <div class="actions">
            <a href="https://www.youtube.com/watch?v=awQzjn72bI0" target="_blank" rel="noopener noreferrer">OPEN YOUTUBE ↗</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <button id="musicBtn" aria-label="Toggle background music" title="Toggle background music">♪</button>

  <script src="ambient-piano.js"></script>
  <script>
    function updateMusicBtn(){
      const btn=document.getElementById('musicBtn');
      if(!btn)return;
      if(window.ISSBackgroundMusic&&typeof window.ISSBackgroundMusic.isPlaying==='function'){
        const playing=window.ISSBackgroundMusic.isPlaying();
        btn.textContent=playing?'⏸':'♪';
        btn.classList.toggle('on',playing);
      }
    }
    document.getElementById('musicBtn').addEventListener('click',()=>setTimeout(updateMusicBtn,120));
    window.addEventListener('DOMContentLoaded',()=>setTimeout(updateMusicBtn,200));
  </script>
</body>
</html>
