<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02060a">
  <title>Live Stream · Earth Observatory</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">
  <style>
    :root{--white:#f4f8fb;--line:rgba(255,255,255,.11);--panel:rgba(3,9,15,.88)}
    html,body{height:100%;margin:0;background:#000;color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .container{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px}
    header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;color:var(--white);margin-bottom:18px}
    .brand{font-weight:900;font-size:22px}
    .card{background:linear-gradient(145deg,rgba(7,16,23,.92),rgba(1,6,11,.76));border:1px solid var(--line);border-radius:8px;padding:12px;width:100%;max-width:920px;box-shadow:0 18px 55px rgba(0,0,0,.45)}
    .livestream-wrap{display:flex;flex-direction:column;gap:12px}
    .head{display:flex;justify-content:space-between;align-items:center;font-weight:700}
    .iframe-wrap{width:100%;display:block;position:relative;padding-top:56.25%;overflow:hidden;border-radius:6px}
    .iframe-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .note{font-size:13px;color:#9fb0bb;margin-top:8px}

    /* small play/music button */
    #musicBtn{position:fixed;right:16px;top:16px;z-index:80;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,0.02);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
    #musicBtn.on{background:linear-gradient(90deg,rgba(116,237,255,.12),rgba(94,240,166,.08));color:#0b0f12}

    @media(max-width:640px){.brand{font-size:16px}.card{padding:8px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">EARTH OBSERVATORY</div>
      <div class="sub">LIVE · NASA EARTH DATA</div>
    </header>

    <main class="card livestream">
      <div class="livestream-wrap">
        <div class="head"><span>LIVE STREAM</span><span class="state">● LIVE</span></div>
        <div class="iframe-wrap">
          <iframe src="https://www.youtube.com/embed/awQzjn72bI0?si=nP0A7CBYnOPeUieE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="note">If the player does not load, open the stream on YouTube: <a href="https://www.youtube.com/watch?v=awQzjn72bI0" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=awQzjn72bI0</a></div>
      </div>
    </main>
  </div>

  <!-- Small play/music button (ambient piano will bind to #musicBtn if present) -->
  <button id="musicBtn" aria-label="Toggle background music" title="Toggle background music">♪</button>

  <script src="ambient-piano.js"></script>
  <script>
    // Keep the button label in sync with the ambient music state.
    function updateMusicBtn(){
      const btn = document.getElementById('musicBtn');
      if(!btn) return;
      if(window.ISSBackgroundMusic && typeof window.ISSBackgroundMusic.isPlaying === 'function'){
        const playing = window.ISSBackgroundMusic.isPlaying();
        btn.textContent = playing ? '⏸' : '♪';
        btn.classList.toggle('on', playing);
      }
    }

    // After ambient-piano binds to #musicBtn it will set onclick; also add our listener to update UI.
    document.getElementById('musicBtn').addEventListener('click',()=>{
      // ambient-piano.toggle will be called (it binds to the element). Wait a tick and then update the icon.
      setTimeout(updateMusicBtn, 120);
    });

    // Ensure correct state on load.
    window.addEventListener('DOMContentLoaded',()=>{
      // Small delay in case ambient-piano initializes after DOMContentLoaded.
      setTimeout(updateMusicBtn, 200);
    });
  </script>
</body>
</html>
